# 桌面端云端打包：Windows / macOS / Linux
#
# 触发方式：
#   1. 手动触发（Actions 页面 → Run workflow）
#   2. 推送 v* 标签，例如  git tag v0.1.0 && git push origin v0.1.0
#
# 产物会自动发布到本仓库的 Release 页面。
# 注意：macOS 产物未签名，首次打开需要执行
#   sudo xattr -r -d com.apple.quarantine /Applications/<应用名>.app

name: 打包桌面版

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 添加编译目标
        run: rustup target add ${{ matrix.target }}

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 安装依赖并生成图标
        run: |
          pnpm install
          pnpm icon

      - name: 编译并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseDraft: false
          prerelease: false
          # 本地默认只出 exe（bundle.active=false），这里追加配置，
          # 让云端产出 .msi/.dmg/.deb/AppImage 等可分发安装包
          args: --target ${{ matrix.target }} --config src-tauri/tauri.bundle.conf.json
