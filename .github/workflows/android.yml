# Android 云端打包：产出可安装的 release APK
#
# 触发方式：
#   1. 手动触发（Actions 页面 → Run workflow）
#   2. 推送 v* 标签
#
# 固定走 release（体积更小、启动更快）。签名分两种情况：
#   - 配了仓库 Secrets，就用你自己的密钥签名，可上架、可覆盖升级：
#       ANDROID_KEYSTORE_BASE64   —— keystore 文件做 base64 后的内容
#       ANDROID_KEYSTORE_PASSWORD —— keystore 与 key 的密码
#     keystore 的 key alias 需为 pakeplus
#   - 没配，就现场生成一个调试密钥来签。产物照样装得上，只是不能上架商店。

name: 打包 Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # 放在 job 级，才能在 step 的 if 条件里判断是否已配置签名
  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 准备 Android SDK
        run: |
          # 不依赖第三方 action：ubuntu runner 自带 Android SDK，只有缺失时才自己下命令行工具。
          # 这样不会被 android-actions/setup-android 的版本变动影响（v3 的下载地址已失效）。
          if command -v sdkmanager > /dev/null 2>&1; then
            echo "使用已有的 sdkmanager: $(command -v sdkmanager)"
          else
            SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
            echo "未找到 sdkmanager，下载命令行工具到 $SDK"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            {
              echo "ANDROID_SDK_ROOT=$SDK"
              echo "ANDROID_HOME=$SDK"
            } >> "$GITHUB_ENV"
            {
              echo "$SDK/cmdline-tools/latest/bin"
              echo "$SDK/platform-tools"
            } >> "$GITHUB_PATH"
            export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          fi
          echo "sdkmanager 版本: $(sdkmanager --version)"

      - name: 接受 Android SDK 许可
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: 安装 NDK
        run: sdkmanager --install "ndk;28.2.13676358"

      - name: 安装编译平台
        run: |
          # 平台的包名带小版本号（platforms;android-37.0），不能写死成 android-37，
          # 否则 sdkmanager 会直接报找不到包。这里从可用列表里动态挑。
          PKG=$(sdkmanager --list 2>/dev/null \
            | sed -n 's/^  \(platforms;android-37[0-9.]*\)[ |].*/\1/p' \
            | sort -u | head -n 1)
          PKG=${PKG:-platforms;android-37.0}
          echo "安装编译平台: $PKG"
          sdkmanager --install "$PKG"

      - name: 安装依赖并生成图标
        run: |
          pnpm install
          pnpm icon

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 写入真实应用名（支持中文）
        run: node scripts/apply-app-name.mjs

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 编译 APK
        run: pnpm tauri android build --target aarch64 --apk

      - name: 签名 APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name 'apksigner' -type f | sort | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name 'zipalign' -type f | sort | tail -n 1)

          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED" ]; then
            echo "::error::没有找到未签名的 APK，编译步骤可能已经失败"
            exit 1
          fi

          # Android 11 起要求 APK 既对齐又签名，顺序不能反：先 zipalign 再 apksigner
          ALIGNED="${UNSIGNED%-unsigned.apk}-aligned.apk"
          "$ZIPALIGN" -f 4 "$UNSIGNED" "$ALIGNED"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > sign.keystore
            ALIAS=pakeplus
            PASS="$KEYSTORE_PASSWORD"
            echo "使用仓库 Secrets 里配置的签名密钥"
          else
            # 没配密钥就现场生成一个调试密钥，保证产物一定能装。
            keytool -genkeypair -keystore sign.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
            ALIAS=androiddebugkey
            PASS=android
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，已改用调试密钥签名。产物可以正常安装，但不能上架应用商店；且调试密钥每次构建都重新生成，无法覆盖安装旧版本。"
          fi

          OUT="${UNSIGNED%-unsigned.apk}.apk"
          "$APKSIGNER" sign \
            --ks sign.keystore --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out "$OUT" "$ALIGNED"
          rm -f sign.keystore "$ALIGNED"
          echo "签名完成: $OUT"

      - name: 清理未签名的中间产物
        run: |
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk'); do
            signed="${f%-unsigned.apk}.apk"
            if [ -f "$signed" ]; then rm -f "$f"; fi
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.version.outputs.value }}
          name: Android v${{ steps.version.outputs.value }}
          draft: false
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
