# Android 云端打包：产出可安装的 APK
#
# 触发方式：
#   1. 手动触发（Actions 页面 → Run workflow），可选 debug / release
#   2. 推送 v* 标签（走 debug，开箱即可安装）
#
# debug 构建用 Android 调试密钥自动签名，下载后可直接装到手机。
# release 构建需要配置签名密钥，否则产物未签名、装不上：
#   仓库 Settings → Secrets and variables → Actions 添加
#     ANDROID_KEYSTORE_BASE64   —— keystore 文件做 base64 后的内容
#     ANDROID_KEYSTORE_PASSWORD —— keystore 与 key 的密码
#   keystore 的 key alias 需为 pakeplus

name: 打包 Android

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建类型（debug 可直接安装；release 需要签名密钥）'
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # 放在 job 级，才能在 step 的 if 条件里判断是否已配置签名
  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 Android SDK 许可
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: 安装 NDK
        run: sdkmanager --install "ndk;28.2.13676358"

      - name: 安装编译平台
        run: |
          # 平台的包名带小版本号（platforms;android-37.0），不能写死成 android-37，
          # 否则 sdkmanager 会直接报找不到包。这里从可用列表里动态挑。
          PKG=$(sdkmanager --list 2>/dev/null \
            | sed -n 's/^  \(platforms;android-37[0-9.]*\)[ |].*/\1/p' \
            | sort -u | head -n 1)
          PKG=${PKG:-platforms;android-37.0}
          echo "安装编译平台: $PKG"
          sdkmanager --install "$PKG"

      - name: 安装依赖并生成图标
        run: |
          pnpm install
          pnpm icon

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 写入真实应用名（支持中文）
        run: node scripts/apply-app-name.mjs

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 编译 APK
        run: |
          if [ "${{ inputs.variant }}" = "release" ]; then
            pnpm tauri android build --target aarch64 --apk
          else
            pnpm tauri android build --target aarch64 --debug --apk
          fi

      - name: 用配置的密钥签名 release APK
        if: inputs.variant == 'release' && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name 'apksigner*' -type f | sort | tail -n 1)
          "$APKSIGNER" sign \
            --ks release.keystore --ks-key-alias pakeplus \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" \
            --out "${UNSIGNED%-unsigned.apk}.apk" "$UNSIGNED"
          rm -f release.keystore
          echo "签名完成: ${UNSIGNED%-unsigned.apk}.apk"

      - name: 未配置签名密钥时给出提示
        if: inputs.variant == 'release' && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，产出的 release APK 未签名、无法安装。改用 debug 构建，或按文件顶部注释配置签名密钥。"

      - name: 清理未签名的中间产物
        run: |
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk'); do
            signed="${f%-unsigned.apk}.apk"
            if [ -f "$signed" ]; then rm -f "$f"; fi
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ inputs.variant || 'debug' }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.version.outputs.value }}
          name: Android v${{ steps.version.outputs.value }}
          draft: false
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
